<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Ujian</title>
<link rel="stylesheet" href="/css/themes.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/exam.css" />
<link rel="stylesheet" href="/css/network-status.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
<div class="exam-shell">

  <header class="exam-topbar">
    <span class="exam-subject-label" id="examSubjectLabel">Memuat ujian...</span>
    <div style="display:flex;align-items:center;gap:6px;">
      <button class="icon-btn" id="btnRefreshExam" aria-label="Segarkan" style="width:32px;height:32px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="btnTheme" aria-label="Ganti tema" style="width:32px;height:32px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a6 6 0 0 0 0 12 4 4 0 0 1 0 8"/></svg>
      </button>
      <span class="exam-timer" id="examTimer">--:--</span>
    </div>
  </header>

  <nav class="exam-nav-strip" id="examNavStrip"></nav>

  <main class="exam-body" id="examBody">
    <div class="skeleton"></div>
  </main>

  <footer class="exam-bottombar">
    <button class="btn btn-ghost" id="btnPrevQuestion">Sebelumnya</button>
    <button class="btn btn-primary" id="btnNextQuestion">Selanjutnya</button>
  </footer>

  <button class="calc-fab" id="calcFab" style="display:none;" aria-label="Kalkulator">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
  </button>

  <div class="calc-modal" id="calcModal">
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-grid" id="calcGrid"></div>
  </div>

  <div class="highlight-toolbar" id="highlightToolbar">
    <div class="highlight-swatch" style="background:#FFF176;" data-color="#FFF176"></div>
    <div class="highlight-swatch" style="background:#AED581;" data-color="#AED581"></div>
    <div class="highlight-swatch" style="background:#F48FB1;" data-color="#F48FB1"></div>
    <div class="highlight-swatch" style="background:#81D4FA;" data-color="#81D4FA"></div>
  </div>

  <div class="exam-lock-overlay" id="lockOverlay">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:16px;"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <h2 style="margin:0 0 8px;font-size:17px;">Ujian Dikunci</h2>
    <p style="margin:0;color:var(--text-secondary);font-size:13px;max-width:280px;" id="lockReasonText">Hubungi panitia ruang untuk membuka kembali.</p>
  </div>

  <div class="modal-scrim" id="themeScrim">
    <div class="modal-sheet">
      <button class="icon-btn modal-close-x" id="themeCloseX" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <h2 class="sheet-title">Pilih Tema</h2>
      <div class="theme-grid" id="themeGrid">
        <div class="theme-swatch" data-theme="dark"><div class="theme-swatch-preview preview-dark"></div><span class="theme-swatch-label">Dark</span></div>
        <div class="theme-swatch" data-theme="light"><div class="theme-swatch-preview preview-light"></div><span class="theme-swatch-label">Light</span></div>
        <div class="theme-swatch" data-theme="pink"><div class="theme-swatch-preview preview-pink"></div><span class="theme-swatch-label">Pink</span></div>
        <div class="theme-swatch" data-theme="hacker"><div class="theme-swatch-preview preview-hacker"></div><span class="theme-swatch-label">Hacker</span></div>
        <div class="theme-swatch" data-theme="minecraft"><div class="theme-swatch-preview preview-minecraft"></div><span class="theme-swatch-label">Voxel</span></div>
      </div>
      <button class="btn btn-ghost modal-close-bottom" id="themeCloseBottom" type="button">Tutup</button>
    </div>
  </div>

  <div class="modal-scrim" id="submitScrim">
    <div class="modal-sheet">
      <h2 class="sheet-title">Kirim Jawaban?</h2>
      <p style="color:var(--text-secondary);font-size:13.5px;margin:-8px 0 var(--space-4);">
        Kamu sudah menjawab <span id="submitAnsweredCount">0</span> dari <span id="submitTotalCount">0</span> soal. Jawaban tidak bisa diubah setelah dikirim.
      </p>
      <button class="btn btn-primary" id="btnConfirmSubmit" type="button">Ya, Kirim Sekarang</button>
      <button class="btn btn-ghost modal-close-bottom" id="btnCancelSubmit" type="button">Batal</button>
    </div>
  </div>

</div>
<script type="module" src="/js/firebase-init.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/session-guard.js"></script>
<script src="/js/network-status.js"></script>
<script src="/js/exam-bridge-web.js"></script>
<script src="/js/theme.js"></script>
<script src="/exam/require-role.js"></script>
<script src="/exam/exam.js"></script>
</body>
</html>
