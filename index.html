<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<title>PatSec &mdash; SMA Negeri 14 Depok</title>
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  .login-main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: calc(100vh - 130px);
  }
  .login-hero { margin-bottom: var(--space-6); animation: rise var(--dur-slow) var(--ease-standard) both; }
  .login-title { font-family: var(--font-display); font-size: 30px; font-weight: 800; margin: 0 0 var(--space-2); letter-spacing: -0.3px; }
  .login-subtitle { margin: 0; color: var(--text-secondary); font-size: 14.5px; line-height: 1.5; }
  .login-card { animation: rise var(--dur-slow) var(--ease-standard) both; animation-delay: 80ms; max-width: 420px; margin: 0 auto; width: 100%; }
  .field-error { min-height: 18px; color: var(--danger); font-size: 12.5px; margin: -6px 0 var(--space-3); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .app-main.login-wrap { max-width: 480px; }
</style>
<link rel="stylesheet" href="css/network-status.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <img class="topbar-logo" src="img/logo.png" alt="" onerror="this.style.visibility='hidden'" />
      <span class="topbar-school" id="schoolName">SMAN 14 DEPOK</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnTheme" aria-label="Ganti tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a6 6 0 0 0 0 12 4 4 0 0 1 0 8"/><circle cx="9" cy="10" r="1"/><circle cx="14" cy="8" r="1"/><circle cx="16" cy="13" r="1"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main login-wrap login-main">
    <div class="login-hero">
      <h1 class="login-title" id="greetingTitle">Selamat datang</h1>
      <p class="login-subtitle">Masuk untuk melanjutkan ujian dan aktivitas sekolah.</p>
    </div>

    <div class="card login-card">
      <div class="tab-switch" id="loginTabSwitch">
        <div class="tab-switch-thumb" id="tabThumb"></div>
        <button type="button" class="active" data-tab="id">NIS / NIP</button>
        <button type="button" data-tab="username">Username</button>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="field" data-panel="id">
          <label class="field-label" for="inputId">Nomor Induk</label>
          <input class="field-input" id="inputId" name="identifier" type="text" inputmode="numeric" placeholder="Masukkan NIS atau NIP" />
        </div>
        <div class="field" data-panel="username" style="display:none">
          <label class="field-label" for="inputUsername">Username</label>
          <input class="field-input" id="inputUsername" name="username" type="text" placeholder="Masukkan username" />
        </div>
        <div class="field">
          <label class="field-label" for="inputPassword">Kata Sandi</label>
          <input class="field-input" id="inputPassword" name="password" type="password" placeholder="Masukkan kata sandi" />
        </div>
        <div class="field-error" id="loginError"></div>
        <button class="btn btn-primary" type="submit" id="btnSubmit">
          <span id="btnSubmitLabel">Masuk</span>
        </button>
      </form>
    </div>
  </main>

  <div id="siteFooter"></div>

  <div class="modal-scrim" id="themeScrim">
    <div class="modal-sheet">
      <button class="icon-btn modal-close-x" id="themeCloseX" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <h2 class="sheet-title">Pilih Tema</h2>
      <div class="theme-grid" id="themeGrid">
        <div class="theme-swatch" data-theme="dark"><div class="theme-swatch-preview preview-dark"></div><span class="theme-swatch-label">Dark</span></div>
        <div class="theme-swatch" data-theme="light"><div class="theme-swatch-preview preview-light"></div><span class="theme-swatch-label">Light</span></div>
        <div class="theme-swatch" data-theme="pink"><div class="theme-swatch-preview preview-pink"></div><span class="theme-swatch-label">Pink</span></div>
        <div class="theme-swatch" data-theme="hacker"><div class="theme-swatch-preview preview-hacker"></div><span class="theme-swatch-label">Hacker</span></div>
        <div class="theme-swatch" data-theme="minecraft"><div class="theme-swatch-preview preview-minecraft"></div><span class="theme-swatch-label">Voxel</span></div>
      </div>
      <button class="btn btn-ghost modal-close-bottom" id="themeCloseBottom" type="button">Tutup</button>
    </div>
  </div>

</div>

<script type="module" src="js/firebase-init.js"></script>
<script src="js/theme.js"></script>
<script src="js/footer.js"></script>
<script src="js/auth.js"></script>
<script src="js/network-status.js"></script>
<script src="js/login-web.js"></script>
</body>
</html>
